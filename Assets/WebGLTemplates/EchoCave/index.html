<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/favicon.png">
    <meta name="theme-color" content="#14102B">
    <style>
      /* Palette from the Penpot Foundations page: bg/deep, bg/rock, echo/cyan, ui/cream. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #14102B;
        /* The game handles every touch itself: no scrolling, pull-to-refresh, zoom or text selection. */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* The canvas fills the whole window (the game scales itself by orientation) and the page never scrolls. */
      #unity-canvas {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: block;
        background: #14102B;
        outline: none;
      }

      #loading {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #14102B;
        color: #FFF4DC;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      #loading-logo {
        width: min(70vw, 420px);
        max-height: 45vh;
        object-fit: contain;
        margin-bottom: 28px;
      }

      #loading-track {
        width: min(60vw, 320px);
        height: 16px;
        border-radius: 8px;
        background: #3A2D6B;
        overflow: hidden;
      }

      #loading-fill {
        width: 0%;
        height: 100%;
        border-radius: 8px;
        background: #4FE3FF;
      }

      #loading-message {
        margin-top: 20px;
        font-size: 16px;
        opacity: 0.8;
        text-align: center;
        padding: 0 24px;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>

    <div id="loading">
      <img id="loading-logo" src="TemplateData/logo.png" alt="{{{ PRODUCT_NAME }}}">
      <div id="loading-track"><div id="loading-fill"></div></div>
      <div id="loading-message">Loading</div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var loadingFill = document.querySelector("#loading-fill");
      var loadingMessage = document.querySelector("#loading-message");

      // Browsers pinch-zoom the page with gestures and open a menu on long press; the game wants neither.
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      // A failure stays on screen as text. An alert() would block the page and hide the reason.
      function showError(message) {
        loading.style.display = "flex";
        loadingFill.style.background = "#FF6B6B";
        loadingMessage.textContent = "Could not start the game: " + message;
      }

      function unityShowBanner(msg, type) {
        if (type == "error") showError(msg);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          loadingFill.style.width = (100 * progress) + "%";
          if (progress >= 1) loadingMessage.textContent = "Starting";
        }).then(function () {
          loading.style.display = "none";
        }).catch(showError);
      };
      script.onerror = function () { showError("the game files did not load"); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
